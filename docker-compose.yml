name: secrets-hub
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_error_verbosity=terse
    environment:
      POSTGRES_DB: secrets_hub
      POSTGRES_USER: secrets_hub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run ./install.sh first}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ${DATA_DIRECTORY:?Run ./install.sh first}/postgres:/var/lib/postgresql/data
    networks:
      hub:
        ipv4_address: ${DB_IP:-172.30.251.4}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U secrets_hub -d secrets_hub']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://secrets_hub:${DB_PASSWORD}@db:5432/secrets_hub
      DATA_DIR: /data
      APP_URL: ${APP_URL:-http://localhost:8080}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      TRUSTED_PROXIES: ${WEB_IP:-172.30.251.3}
    volumes:
      - ${DATA_DIRECTORY}/app:/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      hub:
        ipv4_address: ${API_IP:-172.30.251.2}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      TRUSTED_EDGE_PROXY: ${EDGE_PROXY_IP:-127.0.0.1}
      NGINX_ENVSUBST_FILTER: ^TRUSTED_EDGE_PROXY
    networks:
      hub:
        ipv4_address: ${WEB_IP:-172.30.251.3}
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m
      - /var/cache/nginx:size=128m
      - /var/run:size=1m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  hub:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.251.0/24}
          gateway: ${DOCKER_GATEWAY:-172.30.251.1}
