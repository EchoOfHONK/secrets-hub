geo $realip_remote_addr $trusted_edge {
    default 0;
    ${TRUSTED_EDGE_PROXY} 1;
}
map "$trusted_edge:$http_x_forwarded_proto" $public_scheme {
    default $scheme;
    "1:https" https;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    set_real_ip_from ${TRUSTED_EDGE_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 100m;
    client_body_temp_path /var/cache/nginx/client_temp;
    client_body_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location /api/ {
        limit_req zone=api_requests burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_read_timeout 180s;
    }
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $http_host;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
}
limit_req_zone $binary_remote_addr zone=api_requests:10m rate=30r/s;
